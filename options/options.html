<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抖音数据管理</title>
  <link rel="stylesheet" href="options.css" />
</head>

<body>
  <!-- ====== 固定顶栏（批量操作按钮常驻本栏，批量模式经 body.batch-mode 显隐；侧边栏折叠按钮在最右） ====== -->
  <header id="topBar" class="flex-row">
    <div class="group-selector">
      <div class="group-tabs" id="groupTabs"></div>
    </div>
    <div class="topbar-right flex-row">
      <span id="batchCount" class="batch-count" aria-live="polite">已选 0</span>
      <button class="dy-btn dy-btn-icon flex-inline-center dy-btn-danger batch-action" id="btnBatchDelete" disabled title="移除">
        <svg width="16" height="16"><use href="#icon-delete" /></svg>
      </button>
      <button class="dy-btn dy-btn-icon flex-inline-center batch-action hidden" id="btnBatchSaveToWorks" title="存入作品域">
        <svg width="16" height="16"><use href="#icon-bookmark" /></svg>
      </button>
      <button class="dy-btn dy-btn-icon flex-inline-center batch-action" id="btnBatchMove" disabled title="移动到分组">
        <svg width="16" height="16"><use href="#icon-folder" /></svg>
      </button>
      <button class="dy-btn dy-btn-icon flex-inline-center batch-action" id="btnBatchDownload" disabled title="下载选中的作品">
        <svg width="16" height="16"><use href="#icon-download" /></svg>
      </button>
      <button class="dy-btn dy-btn-icon flex-inline-center batch-action" id="btnBatchSelectAll" title="全选">
        <svg width="16" height="16"><use href="#icon-select-all" /></svg>
      </button>
      <button class="dy-btn flex-inline-center dy-btn-ghost" id="btnBatch" title="批量管理作品">批量</button>
      <button id="btnSidebarToggle" class="btn-sidebar-toggle flex-center" aria-label="展开/收起侧边栏"
        title="展开/收起侧边栏">☰</button>
    </div>
  </header>

  <!-- ====== 搜索栏（侧边栏「搜索」在顶栏下方展开的内联工具条，见 docs/UI_IMPROVEMENTS.md 建议5） ====== -->
  <div id="searchBar" class="search-bar hidden">
    <div class="sb-seg" id="sbScope">
      <button class="sb-seg-btn active" data-scope="all">综合</button>
      <button class="sb-seg-btn" data-scope="author" id="sbScopeAuthor">作者</button>
      <button class="sb-seg-btn" data-scope="title" id="sbScopeTitle">标题</button>
      <button class="sb-seg-btn" data-scope="id">ID</button>
    </div>
    <svg width="16" height="16">
      <use href="#icon-search" />
    </svg>
    <input id="searchInput" type="text" placeholder="搜索标题 / 作者 / ID" spellcheck="false" />
    <span id="sbCount" class="sb-count"></span>
    <span id="sbWorkFilters" class="sb-domain-filters flex-row">
      <div class="sb-seg" id="sbSort">
        <button class="sb-seg-btn active" data-sort="saved">保存时间</button>
        <button class="sb-seg-btn" data-sort="authorCount">作者作品数</button>
      </div>
      <label class="sb-check"><input type="checkbox" id="sbFollowed" checked />已关注</label>
      <label class="sb-check"><input type="checkbox" id="sbUnfollowed" checked />未关注</label>
    </span>
    <span id="sbFollowFilters" class="sb-domain-filters flex-row hidden">
      <div class="sb-seg" id="sbFollowSort">
        <button class="sb-seg-btn active" data-fsort="followers">粉丝数</button>
        <button class="sb-seg-btn" data-fsort="works">作品数</button>
      </div>
    </span>
    <label class="sb-check"><input type="checkbox" id="sbReverse" />逆序</label>
    <button id="btnClearInBar" class="filter-clear-btn">清除</button>
    <button id="btnCloseSearch" class="icon-btn flex-center sb-close" aria-label="收起搜索">✕</button>
  </div>

  <!-- ====== 主体内容 ====== -->
  <div id="appBody">
    <main id="mainGrid">
      <div class="empty-state state-message hidden" id="emptyState">
        <div class="empty-icon flex-center">
          <svg width="48" height="48">
            <use href="#icon-download" />
          </svg>
        </div>
        <p>还没有保存的作品</p>
        <p class="empty-hint">浏览抖音时，作品会自动被捕获</p>
      </div>
      <div class="main-container" id="mainContainer"></div>
      <div class="error-state state-message hidden" id="errorState">
        <div class="error-icon">
          <svg width="48" height="48">
            <use href="#icon-error" />
          </svg>
        </div>
        <p>数据加载失败</p>
        <p class="error-hint">请检查网络后重试</p>
        <button class="dy-btn dy-btn-primary" id="btnRetry">重试</button>
      </div>
    </main>
    <div id="sidebarResizeHandle" class="sidebar-resize-handle" title="点击折叠/展开侧边栏，拖拽调整宽度"></div>
    <aside id="sidebar" class="sidebar">
      <div id="sidebarBody" class="sidebar-body">
        <div id="sidebarWorksGrid" class="sidebar-works-grid"></div>
        <div id="sidebarLoader" class="sidebar-loader hidden flex-center">
          <div class="spinner"></div>
        </div>
      </div>
    </aside>
    <!-- 域切换 + 功能菜单侧边栏：位于最右（比关注域作者作品侧边栏更靠右），☰ 按钮在顶栏最右折叠/展开 -->
    <aside id="leftSidebar" class="left-sidebar">
      <div class="left-sidebar-inner">
        <div class="domain-switch">
          <div class="ds-slider"></div>
          <button class="ds-btn active" data-domain="works">作品</button>
          <button class="ds-btn" data-domain="followings">关注</button>
          <button class="ds-btn" data-domain="likes">点赞</button>
          <button class="ds-btn" data-domain="favorites">收藏</button>
        </div>
        <div class="menu-divider"></div>
        <nav class="left-sidebar-menu flex-col">
          <button class="menu-item" id="btnSync">同步</button>
          <button class="menu-item" id="btnImport">导入</button>
          <button class="menu-item" id="btnExport">导出</button>
          <button class="menu-item" id="btnGroupManage">分组</button>
          <button class="menu-item" id="btnSearch">搜索</button>
          <button class="menu-item" id="btnSettings">设置</button>
        </nav>
        <div class="menu-spacer"></div>
        <div class="menu-divider"></div>
        <button class="menu-item danger" id="btnReset">重置</button>
        <div class="menu-storage" id="menuStorage">— MB</div>
      </div>
    </aside>
  </div>

  <!-- ====== 详情报覆盖层（对齐抖音播放界面：全宽播放器 + 56px 播放条） ====== -->
  <div id="detailOverlay" class="flex-col hidden">
    <button id="detailClose" class="flex-center" aria-label="关闭详情">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
        <path d="M5 5l14 14M19 5L5 19" />
      </svg>
    </button>
    <div class="detail-body">
      <!-- 清晰画面区（居中 39.3vw 裁切铺满，两侧由 overlay 模糊背景填充） -->
      <div class="media-view">
        <div id="detailVideoContainer" class="flex-col hidden">
          <div id="detailVideoWrap" class="flex-center">
            <video id="detailVideo" playsinline></video>
            <!-- 加载中指示（建议17） -->
            <div id="detailLoader" class="detail-loader hidden flex-center">
              <div class="spinner"></div>
            </div>
          </div>
        </div>
        <div id="detailImageContainer" class="hidden">
          <div class="detail-image-container flex-center">
            <img id="detailImage" style="transition: opacity 0.2s" />
            <audio id="detailAudio" style="display: none"></audio>
          </div>
        </div>
      </div>
      <!-- 导航箭头挂 .detail-body 直下：不参与作品切换动效（容器淡入淡出与媒体滑动） -->
      <div id="detailNavLeft" class="detail-nav-btn flex-center hidden" aria-label="上一张">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </div>
      <div id="detailNavRight" class="detail-nav-btn detail-nav-right flex-center hidden" aria-label="下一张">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
          <path d="M9 6l6 6-6 6" />
        </svg>
      </div>
    </div>
    <!-- 上/下作品切换胶囊（对齐抖音 ⌃⌄：右缘垂直居中，切上一个/下一个作品） -->
    <div id="detailSwitcher" class="detail-switcher">
      <button id="detailSwitchPrev" class="flex-center" aria-label="上一个作品">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 15l-6-6-6 6" />
        </svg>
      </button>
      <button id="detailSwitchNext" class="flex-center" aria-label="下一个作品">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </button>
    </div>
    <div id="detailBottomBar">
      <!-- 进度条贴播放条顶缘（通栏）：视频=连续轨道+时间气泡，图集=分段进度（与音乐同步） -->
      <div id="detailProgress" role="slider" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="track-wrap video-mode">
          <div class="track">
            <div class="track-buffered"></div>
            <div class="track-played"></div>
            <div class="track-thumb"></div>
          </div>
          <span class="time-tip">0:00 / 0:00</span>
        </div>
        <div id="noteSegs" class="hidden"></div>
      </div>
      <div class="bar-group bar-controls flex-row">
        <button id="detailPlayBtn" class="detail-bar-btn icon-btn flex-center" aria-label="播放"></button>
        <span id="detailTime" class="detail-bar-text detail-bar-time hidden">0:00 / 0:00</span>
        <span id="detailOrder" class="detail-bar-text detail-bar-order hidden">1/1</span>
      </div>
      <span class="bar-divider"></span>
      <div class="bar-group bar-meta flex-row">
        <a id="detailAuthor" class="detail-bar-text detail-bar-author hidden" target="_blank" rel="noopener"></a>
        <a id="detailTitle" class="detail-bar-title text-ellipsis" target="_blank" rel="noopener"></a>
      </div>
      <span class="bar-divider"></span>
      <div class="bar-group bar-actions flex-row">
        <button id="detailMuteBtn" class="detail-bar-btn icon-btn flex-center" aria-label="静音"></button>
        <button id="detailRemoveBtn" class="detail-bar-btn icon-btn flex-center" title="移除" aria-label="移除">
          <svg width="24" height="24">
            <use href="#icon-delete" />
          </svg>
        </button>
        <button id="detailLoopBtn" class="detail-bar-btn icon-btn flex-center" title="循环模式" aria-label="循环模式"></button>
        <button id="detailSyncBtn" class="detail-bar-btn icon-btn flex-center" title="同步" aria-label="同步">
          <svg width="24" height="24">
            <use href="#icon-sync" />
          </svg>
        </button>
        <button id="detailDownloadBtn" class="detail-bar-btn icon-btn flex-center" title="下载" aria-label="下载">
          <svg width="24" height="24">
            <use href="#icon-download" />
          </svg>
        </button>
        <span id="detailCounter" class="detail-bar-text detail-bar-counter hidden"></span>
      </div>
    </div>
  </div>

  <!-- ====== 自定义弹窗容器（抖音风格） ====== -->
  <div id="dialogOverlay" class="hidden">
    <div class="dy-dialog flex-col" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="dy-dialog-header flex-row">
        <span id="dialogTitle"></span>
        <button class="dy-dialog-close icon-btn flex-center" id="dialogClose" aria-label="关闭">✕</button>
      </div>
      <div class="dy-dialog-body" id="dialogBody"></div>
      <div class="dy-dialog-footer" id="dialogFooter"></div>
    </div>
  </div>

  <!-- 骨架与完整卡同构（原地填充/降级不换根节点），仅类名与占位样式不同；
       头像失败时由 following-avatar-fallback 显示昵称首字占位。
       头像必须是 div+background-image：背景图加载失败浏览器不绘制裂图图标，元素层面杜绝断裂图 -->
  <template id="followingSkeletonTemplate">
    <div class="following-card following-skeleton" data-uid="">
      <div class="following-main">
        <div class="following-avatar" role="img"></div>
        <span class="following-avatar-fallback hidden"></span>
        <div class="following-nickname"></div>
      </div>
      <div class="following-stats">
        <span class="stat-followers"></span>
        <span class="stat-works"></span>
      </div>
    </div>
  </template>

  <!-- ====== 侧边栏作品模板 ====== -->
  <template id="sidebarWorkTemplate">
    <div class="sidebar-work-item">
      <a target="_blank" rel="noopener" class="sidebar-work-link">
        <!-- 封面必须是 div+background-image：背景图失败浏览器不绘制裂图图标，内联 onerror 一并废除 -->
        <div class="sidebar-work-cover"></div>
        <div class="sidebar-work-cover-placeholder">📹</div>
        <div class="sidebar-work-plays"></div>
        <div class="work-type-badge flex-row hidden">
          <svg width="12" height="12">
            <use href="#icon-image-badge" />
          </svg>
        </div>
      </a>
    </div>
  </template>

  <!-- ====== 作品卡片模板 ====== -->
  <template id="workCardTemplate">
    <div class="work-card flex-col">
      <div class="work-media">
        <div class="work-type-badge flex-row hidden">
          <svg width="12" height="12">
            <use href="#icon-image-badge" />
          </svg>
        </div>
        <!-- 缩略图必须是 div+background-image：背景图加载失败浏览器不绘制裂图图标，元素层面杜绝断裂图 -->
        <div class="work-thumb" role="img"></div>
        <video class="work-video-player" muted playsinline preload="none"></video>
        <div class="work-video-controls">
          <div class="video-controls-top">
            <button class="video-play-btn detail-bar-btn icon-btn flex-center" aria-label="播放预览"></button>
            <span class="video-time">0:00 / 0:00</span>
            <button class="video-mute-btn detail-bar-btn icon-btn flex-center" aria-label="静音预览"></button>
          </div>
          <input type="range" class="video-progress" min="0" max="100" value="0" aria-label="播放进度" />
        </div>
      </div>
      <div class="work-checkbox" role="checkbox" aria-checked="false" aria-label="选择作品"></div>
      <div class="work-title flex-row">
        <span class="work-title-text text-ellipsis">无文案</span>
        <button class="work-action-btn icon-btn flex-center" title="同步">
          <svg width="24" height="24">
            <use href="#icon-sync" />
          </svg>
        </button>
        <button class="work-action-btn icon-btn flex-center" title="下载">
          <svg width="24" height="24">
            <use href="#icon-download" />
          </svg>
        </button>
      </div>
    </div>
  </template>

  <template id="workSkeletonTemplate">
    <div class="work-card work-skeleton flex-col">
      <div class="work-media"></div>
      <div class="work-title flex-row">
        <span class="work-title-text text-ellipsis"></span>
      </div>
    </div>
  </template>

  <!-- ====== 分组 tab 模板 ====== -->
  <template id="groupTabTemplate">
    <button class="group-tab"></button>
  </template>

  <!-- ====== 分组管理列表项模板 ====== -->
  <template id="groupListItemTemplate">
    <div class="group-list-item flex-row" draggable="true">
      <span class="drag-handle">⠿</span>
      <span class="group-name"></span>
      <div class="group-actions">
        <button class="dy-btn flex-inline-center dy-btn-sm dy-btn-ghost rename-btn">
          <span class="btn-icon flex-inline-center"><svg width="14" height="14">
              <use href="#icon-edit" />
            </svg></span>
        </button>
        <button class="dy-btn flex-inline-center dy-btn-sm dy-btn-ghost dy-btn-danger delete-btn" aria-label="删除分组">
          <span class="btn-icon flex-inline-center"><svg width="14" height="14">
              <use href="#icon-delete" />
            </svg></span>
        </button>
      </div>
    </div>
  </template>

  <!-- ====== 分组选择列表项模板 ====== -->
  <template id="groupSelectItemTemplate">
    <div class="group-select-item flex-row">
      <span class="btn-icon flex-inline-center"><svg width="14" height="14">
          <use href="#icon-folder" />
        </svg></span>
    </div>
  </template>

  <!-- ====== 同步弹窗 body 骨架模板 ====== -->
  <template id="syncDialogBodyTemplate">
    <div class="sync-line">
      <span class="sync-count"></span>
      <span class="sync-summary"></span>
      <span class="sync-status"></span>
    </div>
  </template>

  <!-- ====== 确认删除分组模板 ====== -->
  <template id="confirmDeleteGroupTemplate">
    <p class="confirm-delete-msg">
      确定删除分组「<strong class="confirm-delete-group-name"></strong>」？<br />该分组下的作品将移回「未分组」。
    </p>
  </template>

  <!-- ====== 分组管理模板 ====== -->
  <template id="groupManageTemplate">
    <div class="group-mgmt-input">
      <input type="text" id="newGroupInput" placeholder="输入新分组名称..." maxlength="20" />
      <button class="dy-btn flex-inline-center dy-btn-primary" id="addGroupBtn">添加</button>
    </div>
    <div class="group-list" id="groupList"></div>
  </template>

  <!-- ====== 导入结果模板 ====== -->
  <template id="importResultTemplate">
    <div class="import-result">
      <p>文件路径：<code class="import-file-name"></code></p>
      <p>✅ 新增作品：<span class="stat stat-ok import-added"></span> 条</p>
      <p>🔄 更新作品：<span class="stat stat-dup import-updated"></span> 条</p>
      <p>❌ 无效数据：<span class="stat stat-invalid import-invalid"></span> 条</p>
      <p>📊 当前总计：<span class="stat stat-total import-total"></span> 条</p>
    </div>
  </template>

  <!-- ====== 设置面板模板 ====== -->
  <template id="settingsDialogTemplate">
    <div class="settings-panel">
      <section class="settings-section">
        <h3 class="settings-section-title">
          <span class="section-title-text">运行参数</span>
          <button class="cookie-copy-all-btn" id="btnResetConfig" title="填入默认值，关闭面板时保存">恢复默认</button>
          <span class="section-chevron"></span>
        </h3>
        <div class="section-body">
          <div class="section-body-inner" id="settingsConfigSection">
            <div class="kv-row"><label class="bf-label">请求超时 (ms)</label><input class="bf-input config-input" data-key="timeoutRequest" type="number" /></div>
            <div class="kv-row"><label class="bf-label">安全状态超时 (ms)</label><input class="bf-input config-input" data-key="timeoutSecurityStatus" type="number" /></div>
            <div class="cache-divider"></div>
            <div class="kv-row"><label class="bf-label">同步作品 延迟 min/max (ms)</label><input class="bf-input config-input" data-key="syncWorksDelayMin" type="number" style="width:80px" /><span style="margin:0 4px;color:var(--dy-text-muted)">~</span><input class="bf-input config-input" data-key="syncWorksDelayMax" type="number" style="width:80px" /></div>
            <div class="kv-row"><label class="bf-label">同步关注 延迟 min/max (ms)</label><input class="bf-input config-input" data-key="syncFollowingsDelayMin" type="number" style="width:80px" /><span style="margin:0 4px;color:var(--dy-text-muted)">~</span><input class="bf-input config-input" data-key="syncFollowingsDelayMax" type="number" style="width:80px" /></div>
            <div class="kv-row"><label class="bf-label">扫描点赞 延迟 min/max (ms)</label><input class="bf-input config-input" data-key="syncFavoritesDelayMin" type="number" style="width:80px" /><span style="margin:0 4px;color:var(--dy-text-muted)">~</span><input class="bf-input config-input" data-key="syncFavoritesDelayMax" type="number" style="width:80px" /></div>
            <div class="kv-row"><label class="bf-label">扫描收藏 延迟 min/max (ms)</label><input class="bf-input config-input" data-key="syncCollectionDelayMin" type="number" style="width:80px" /><span style="margin:0 4px;color:var(--dy-text-muted)">~</span><input class="bf-input config-input" data-key="syncCollectionDelayMax" type="number" style="width:80px" /></div>
            <div class="kv-row"><label class="bf-label">取消点赞 延迟 min/max (ms)</label><input class="bf-input config-input" data-key="cancelLikeDelayMin" type="number" style="width:80px" /><span style="margin:0 4px;color:var(--dy-text-muted)">~</span><input class="bf-input config-input" data-key="cancelLikeDelayMax" type="number" style="width:80px" /></div>
            <div class="kv-row"><label class="bf-label">取消收藏 延迟 min/max (ms)</label><input class="bf-input config-input" data-key="cancelCollectionDelayMin" type="number" style="width:80px" /><span style="margin:0 4px;color:var(--dy-text-muted)">~</span><input class="bf-input config-input" data-key="cancelCollectionDelayMax" type="number" style="width:80px" /></div>
            <div class="cache-divider"></div>
            <div class="kv-row"><label class="bf-label">同步批次大小</label><input class="bf-input config-input" data-key="syncBatchSize" type="number" /></div>
            <div class="kv-row"><label class="bf-label">批次暂停最小值 (ms)</label><input class="bf-input config-input" data-key="syncBatchPauseMin" type="number" /></div>
            <div class="kv-row"><label class="bf-label">批次暂停最大值 (ms)</label><input class="bf-input config-input" data-key="syncBatchPauseMax" type="number" /></div>
            <div class="kv-row"><label class="bf-label">保活间隔 (ms)</label><input class="bf-input config-input" data-key="syncKeepaliveInterval" type="number" /></div>
            <div class="kv-row"><label class="bf-label">最大重试次数</label><input class="bf-input config-input" data-key="syncRetryMax" type="number" /></div>
            <div class="cache-divider"></div>
            <div class="settings-mode-row"><span>同步关注后校准作品/粉丝数</span><div class="mode-switch" id="settingsCalibrateSwitch"><div class="mode-slider"></div><button class="mode-btn" data-mode="off">关闭</button><button class="mode-btn active" data-mode="on">开启</button></div></div>
            <div class="cache-divider"></div>
            <div class="settings-mode-row"><span>启用独立模式（无需抖音标签页）</span><div class="mode-switch" id="settingsModeSwitch"><div class="mode-slider" id="settingsModeSlider"></div><button class="mode-btn active" data-mode="off">关闭</button><button class="mode-btn" data-mode="on">开启</button></div></div>
            <p class="settings-hint" id="settingsModeHint">加载中…</p>
            <div class="kv-row bf-item" style="margin-top:6px">
              <label class="bf-label">secUid（用户身份）</label>
              <input class="bf-input" id="settingsSecUid" type="text" placeholder="打开抖音个人页自动捕获，或手动输入" spellcheck="false" />
            </div>
            <div class="cache-divider"></div>
            <div id="settingsCacheList"></div>
          </div>
        </div>
      </section>
      <section class="settings-section">
        <h3 class="settings-section-title">
          <span class="section-title-text">Cookie 配置</span>
          <span class="section-chevron"></span>
        </h3>
        <div class="section-body">
          <div class="section-body-inner" id="settingsCookieList"></div>
        </div>
      </section>
      <section class="settings-section">
        <h3 class="settings-section-title">
          <span class="section-title-text">浏览器特征</span>
          <span class="section-chevron"></span>
        </h3>
        <div class="section-body">
          <div class="section-body-inner">
            <div id="settingsBFList"></div>
          </div>
        </div>
      </section>
      <section class="settings-section">
        <h3 class="settings-section-title">
          <span class="section-title-text">Tab 模式</span>
          <span class="section-chevron"></span>
        </h3>
        <div class="section-body">
          <div class="section-body-inner">
            <div class="cookie-status"><span class="sec-label">密钥</span><span class="sec-value" id="secKeyStatus">加载中…</span></div>
            <div class="sec-item sec-clickable" id="secKeyValue">
              <span class="sec-value sec-truncate" id="secKeyValueText"></span>
              <span class="sec-expand-hint hidden">[展开]</span>
              <button class="sec-copy-btn hidden" data-copy="secKeyValueText">复制</button>
            </div>
            <div class="sec-hint hidden" id="secKeyHint"></div>
            <div class="sec-item">
              <span class="sec-label">详情捕获</span>
              <span class="sec-value" id="secSigDetailStatus"></span>
            </div>
            <div class="sec-item sec-clickable" id="secSigDetail">
              <span class="sec-value sec-truncate" id="secSigDetailValue"></span>
              <span class="sec-expand-hint hidden">[展开]</span>
              <button class="sec-copy-btn hidden" data-copy="secSigDetailValue">复制</button>
            </div>
            <div class="sec-hint hidden" id="secSigDetailHint"></div>
            <div class="sec-item">
              <span class="sec-label">关注捕获</span>
              <span class="sec-value" id="secSigFollowingStatus"></span>
            </div>
            <div class="sec-item sec-clickable" id="secSigFollowing">
              <span class="sec-value sec-truncate" id="secSigFollowingValue"></span>
              <span class="sec-expand-hint hidden">[展开]</span>
              <button class="sec-copy-btn hidden" data-copy="secSigFollowingValue">复制</button>
            </div>
            <div class="sec-hint hidden" id="secSigFollowingHint"></div>
            <div class="sec-item">
              <span class="sec-label">资料捕获</span>
              <span class="sec-value" id="secSigProfileStatus"></span>
            </div>
            <div class="sec-item sec-clickable" id="secSigProfile">
              <span class="sec-value sec-truncate" id="secSigProfileValue"></span>
              <span class="sec-expand-hint hidden">[展开]</span>
              <button class="sec-copy-btn hidden" data-copy="secSigProfileValue">复制</button>
            </div>
            <div class="sec-hint hidden" id="secSigProfileHint"></div>
            <div class="sec-item">
              <span class="sec-label">作品捕获</span>
              <span class="sec-value" id="secSigPostStatus"></span>
            </div>
            <div class="sec-item sec-clickable" id="secSigPost">
              <span class="sec-value sec-truncate" id="secSigPostValue"></span>
              <span class="sec-expand-hint hidden">[展开]</span>
              <button class="sec-copy-btn hidden" data-copy="secSigPostValue">复制</button>
            </div>
            <div class="sec-hint hidden" id="secSigPostHint"></div>
            <div class="sec-item">
              <span class="sec-label">点赞捕获</span>
              <span class="sec-value" id="secSigFavoriteStatus"></span>
            </div>
            <div class="sec-item sec-clickable" id="secSigFavorite">
              <span class="sec-value sec-truncate" id="secSigFavoriteValue"></span>
              <span class="sec-expand-hint hidden">[展开]</span>
              <button class="sec-copy-btn hidden" data-copy="secSigFavoriteValue">复制</button>
            </div>
            <div class="sec-hint hidden" id="secSigFavoriteHint"></div>
            <div class="sec-item">
              <span class="sec-label">收藏捕获</span>
              <span class="sec-value" id="secSigCollectionStatus"></span>
            </div>
            <div class="sec-item sec-clickable" id="secSigCollection">
              <span class="sec-value sec-truncate" id="secSigCollectionValue"></span>
              <span class="sec-expand-hint hidden">[展开]</span>
              <button class="sec-copy-btn hidden" data-copy="secSigCollectionValue">复制</button>
            </div>
            <div class="sec-hint hidden" id="secSigCollectionHint"></div>
            <div class="sec-item">
              <span class="sec-label">Fetch Hook</span>
              <span class="sec-value" id="secHookFetch">加载中…</span>
            </div>
            <div class="sec-item">
              <span class="sec-label">XHR Hook</span>
              <span class="sec-value" id="secHookXhr">加载中…</span>
            </div>
          </div>
        </div>
      </section>
    </div>
  </template>
