<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抖音数据管理</title>
  <link rel="stylesheet" href="options.css" />
  <!-- 封面/头像 CDN 预连接：网格探针首次拉图省 DNS+TLS。host 簇定案见 docs/02
       「图床家族直链解剖」：封面在 p3/p9-pc-sign 两簇（需签名校验），头像在 p3-pc 无签名簇 -->
  <link rel="preconnect" href="https://p3-pc-sign.douyinpic.com" />
  <link rel="preconnect" href="https://p9-pc-sign.douyinpic.com" />
  <link rel="preconnect" href="https://p3-pc.douyinpic.com" />
</head>

<body>
  <!-- ====== 固定顶栏（单行工具区：分组按钮组 → 搜索控件组 → 域特定控件组 → 批量；
       宽度不足时按序折行；批量操作在内容区底部工具条） ====== -->
  <header id="topBar" class="flex-row">
    <div class="group-selector">
      <div class="group-tabs" id="groupTabs"></div>
    </div>
    <!-- 搜索 + 域控件 + 批量作为一个控件簇整体折行：
         窄窗时整簇落到下一行，避免「搜索占第一行、筛选/批量被挤到第二行」的割裂布局 -->
    <div class="topbar-controls flex-row">
      <div class="sb-field">
        <input id="searchInput" type="text" placeholder="输入昵称或 UID" spellcheck="false" />
        <button id="btnClearInBar" class="sb-input-clear" title="清除搜索内容" aria-label="清除搜索内容">✕</button>
        <button id="btnSearchGo" class="sb-input-go" title="搜索（回车）" aria-label="搜索">
          <svg width="16" height="16"><use href="#icon-search" /></svg>
        </button>
        <span id="sbCount" class="sb-count"></span>
      </div>
      <!-- 右侧尾部簇：域特定控件 + 批量作为一个整体，避免「批量」单独换行的孤立行 -->
      <div class="topbar-tail flex-row">
        <span id="sbWorkFilters" class="sb-domain-filters flex-row">
          <div id="sbType" class="sb-scope" role="combobox" tabindex="0" aria-label="作品类型"
            aria-haspopup="listbox" aria-expanded="false" aria-controls="sbTypeMenu">
            <span class="sb-scope-value">全部</span>
            <span class="sb-scope-arrow" aria-hidden="true">▾</span>
            <div id="sbTypeMenu" class="sb-scope-menu hidden" role="listbox" aria-label="作品类型选项">
              <button class="sb-scope-option active" role="option" data-type="all" aria-selected="true">全部</button>
              <button class="sb-scope-option" role="option" data-type="video" aria-selected="false">视频</button>
              <button class="sb-scope-option" role="option" data-type="note" aria-selected="false">图集</button>
            </div>
          </div>
          <div id="sbSort" class="sb-scope" role="combobox" tabindex="0" aria-label="排序方式"
            aria-haspopup="listbox" aria-expanded="false" aria-controls="sbSortMenu">
            <span class="sb-scope-value">保存时间(降)</span>
            <span class="sb-scope-arrow" aria-hidden="true">▾</span>
            <div id="sbSortMenu" class="sb-scope-menu hidden" role="listbox" aria-label="排序方式选项">
              <button class="sb-scope-option active" role="option" data-sort="saved-desc" aria-selected="true">保存时间(降)</button>
              <button class="sb-scope-option" role="option" data-sort="saved-asc" aria-selected="false">保存时间(升)</button>
              <button class="sb-scope-option" role="option" data-sort="authorCount-desc" aria-selected="false">作品数(降)</button>
              <button class="sb-scope-option" role="option" data-sort="authorCount-asc" aria-selected="false">作品数(升)</button>
            </div>
          </div>
        </span>
        <span id="sbFollowFilters" class="sb-domain-filters flex-row hidden">
          <div id="sbFollowSort" class="sb-scope" role="combobox" tabindex="0" aria-label="排序方式"
            aria-haspopup="listbox" aria-expanded="false" aria-controls="sbFollowSortMenu">
            <span class="sb-scope-value">作品数(降)</span>
            <span class="sb-scope-arrow" aria-hidden="true">▾</span>
            <div id="sbFollowSortMenu" class="sb-scope-menu hidden" role="listbox" aria-label="排序方式选项">
              <button class="sb-scope-option active" role="option" data-fsort="works-desc" aria-selected="true">作品数(降)</button>
              <button class="sb-scope-option" role="option" data-fsort="works-asc" aria-selected="false">作品数(升)</button>
              <button class="sb-scope-option" role="option" data-fsort="update-desc" aria-selected="false">最近更新(降)</button>
              <button class="sb-scope-option" role="option" data-fsort="update-asc" aria-selected="false">最近更新(升)</button>
            </div>
          </div>
        </span>
      </div>
    </div>
  </header>

  <!-- ====== 主体内容 ====== -->
  <div id="appBody">
    <div id="mainCol" class="flex-col">
      <!-- 网格与侧边作品栏左右并排（右侧菜单栏仍独占全高） -->
      <div id="contentRow" class="content-row">
        <main id="mainGrid">
          <div class="empty-state state-message hidden" id="emptyState">
            <div class="empty-icon flex-center">
              <svg width="48" height="48">
                <use href="#icon-download" />
              </svg>
            </div>
            <p>还没有保存的作品</p>
            <p class="empty-hint">浏览抖音时，作品会自动被捕获</p>
          </div>
          <div class="main-container" id="mainContainer"></div>
          <div class="error-state state-message hidden" id="errorState">
            <div class="error-icon">
              <svg width="48" height="48">
                <use href="#icon-error" />
              </svg>
            </div>
            <p>数据加载失败</p>
            <p class="error-hint">请检查网络后重试</p>
            <button class="dy-btn dy-btn-primary" id="btnRetry">重试</button>
          </div>
        </main>
        <div id="sidebarResizeHandle" class="sidebar-resize-handle" title="点击折叠/展开侧边栏，拖拽调整宽度"></div>
        <!-- 初始即折叠：侧栏内容恒绑定作者上下文，避免脚本初始化前以默认宽度闪现空面板 -->
        <aside id="sidebar" class="sidebar sidebar-zero">
          <div id="sidebarBody" class="sidebar-body">
            <!-- 作者上下文头：吸顶显示身份/统计，滚动作品时仍能确认当前作者 -->
            <div id="sidebarAuthorHead" class="sidebar-author-head">
              <div id="sidebarAuthorAvatar" class="sidebar-author-avatar flex-center" role="img"></div>
              <div class="sidebar-author-meta">
                <div class="sidebar-author-name-row">
                  <a id="sidebarAuthorName" class="sidebar-author-name" target="_blank" rel="noopener"></a>
                  <span id="sidebarAuthorStatus" class="sidebar-author-status hidden"></span>
                </div>
                <div id="sidebarAuthorSub" class="sidebar-author-sub"></div>
              </div>
              <div class="sidebar-author-actions">
                <button id="sidebarAuthorImportWorks" class="sidebar-author-action" type="button"
                  title="导入该作者全部作品到作品域" aria-label="导入该作者全部作品到作品域">
                  <svg width="18" height="18"><use href="#icon-bookmark-line" /></svg>
                </button>
                <button id="sidebarAuthorAddCandidate" class="sidebar-author-action hidden" type="button"
                  title="加入候选域" aria-label="将该作者加入候选域">
                  <svg width="18" height="18"><use href="#icon-user-plus" /></svg>
                </button>
                <button id="sidebarAuthorRemoveCandidate" class="sidebar-author-action hidden" type="button"
                  title="从候选域移除" aria-label="将该作者从候选域移除">
                  <svg width="18" height="18"><use href="#icon-user-minus" /></svg>
                </button>
                <button id="sidebarAuthorRefresh" class="sidebar-author-action" type="button"
                  title="刷新作品栏" aria-label="刷新作品栏">
                  <svg width="18" height="18"><use href="#icon-sync" /></svg>
                </button>
                <button id="sidebarAuthorClose" class="sidebar-author-action" type="button"
                  title="收起作品栏" aria-label="收起作品栏">
                  <svg width="18" height="18"><use href="#icon-close" /></svg>
                </button>
              </div>
            </div>
            <div id="sidebarWorksGrid" class="sidebar-works-grid"></div>
            <!-- 列表终点提示：全部页取完（无更多游标）且有成列内容时驻底显示，替代「加载圈悬停」暗示 -->
            <div id="sidebarEndNotice" class="sidebar-end-notice hidden">已全部加载</div>
            <div id="sidebarLoader" class="sidebar-loader hidden flex-center">
              <div class="spinner"></div>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <!-- 域切换 + 功能菜单导航轨：位于最右，贯穿顶栏到页面底部（全高，固定 48px） -->
  <aside id="rightSidebar" class="right-sidebar">
    <div class="right-sidebar-inner">
      <!-- 批量入口：位于导航轨顶部，与下方域切换以分隔线断开 -->
      <button class="menu-item" id="btnBatch">
        <svg class="rail-icon" width="18" height="18"><use href="#icon-select-all" /></svg><span>批量</span>
      </button>
      <div class="menu-divider"></div>
      <div class="domain-switch">
        <div class="ds-slider"></div>
        <button class="ds-btn active" data-domain="works">
          <svg class="rail-icon" width="18" height="18"><use href="#icon-works" /></svg><span>作品</span>
        </button>
        <button class="ds-btn" data-domain="favorites">
          <svg class="rail-icon" width="18" height="18"><use href="#icon-heart-line" /></svg><span>点赞</span>
        </button>
        <button class="ds-btn" data-domain="collections">
          <svg class="rail-icon" width="18" height="18"><use href="#icon-star-line" /></svg><span>收藏</span>
        </button>
        <button class="ds-btn" data-domain="followings">
          <svg class="rail-icon" width="18" height="18"><use href="#icon-users" /></svg><span>关注</span>
        </button>
        <button class="ds-btn" data-domain="candidates">
          <svg class="rail-icon" width="18" height="18"><use href="#icon-user-plus" /></svg><span>候选</span>
        </button>
        <button class="ds-btn" data-domain="review">
          <svg class="rail-icon" width="18" height="18"><use href="#icon-shuffle" /></svg><span>回顾</span>
        </button>
      </div>
      <div class="menu-divider"></div>
      <nav class="right-sidebar-menu flex-col">
        <button class="menu-item" id="btnSync">
          <svg class="rail-icon" width="18" height="18"><use href="#icon-sync" /></svg><span>同步</span>
        </button>
        <button class="menu-item" id="btnGroupManage">
          <svg class="rail-icon" width="18" height="18"><use href="#icon-folder" /></svg><span>分组</span>
        </button>
        <button class="menu-item" id="btnAuthorImport">
          <svg class="rail-icon" width="18" height="18"><use href="#icon-tools" /></svg><span>工具</span>
        </button>
        <button class="menu-item" id="btnSettings">
          <svg class="rail-icon" width="18" height="18"><use href="#icon-settings" /></svg><span>设置</span>
        </button>
      </nav>
      <div class="menu-spacer"></div>
      <div class="menu-divider"></div>
      <button class="menu-item" id="btnStatus">
        <svg class="rail-icon" width="18" height="18"><use href="#icon-status" /></svg><span>状态</span>
      </button>
      <button class="menu-item" id="btnDataTools">
        <svg class="rail-icon" width="18" height="18"><use href="#icon-database" /></svg><span>维护</span>
      </button>
      <div class="menu-storage" id="menuStorage"><span class="storage-num">—</span><span class="storage-unit">MB</span></div>
    </div>
  </aside>

  <!-- 批量底部工具条：复用原顶栏按钮 id，批量模式经 body.batch-mode 显隐；
       固定在主内容区底部居中，操作对象与按钮保持在同一视线带 -->
  <div id="batchBar" class="batch-bar" role="toolbar" aria-label="批量操作">
    <div class="batch-bar-count" aria-live="polite" aria-label="已选 0 / 0 项" title="Shift+点击连选">
      <span>已选</span><b id="batchCount">0</b><span class="batch-bar-total">/ <span id="batchTotal">0</span></span><span>项</span>
    </div>
    <span class="batch-bar-sep"></span>
    <button class="batch-bar-btn" id="btnBatchSelectAll" title="全选（Ctrl+A）" aria-keyshortcuts="Control+A">
      <svg width="15" height="15"><use href="#icon-select-all" /></svg><span class="batch-bar-label">全选</span>
    </button>
    <button class="batch-bar-btn" id="btnBatchMove" disabled title="移动到分组（M）" aria-keyshortcuts="M">
      <svg width="15" height="15"><use href="#icon-folder" /></svg><span>移动</span>
    </button>
    <button class="batch-bar-btn" id="btnBatchDownload" disabled title="下载（D）" aria-keyshortcuts="D">
      <svg width="15" height="15"><use href="#icon-download" /></svg><span>下载</span>
    </button>
    <button class="batch-bar-btn hidden" id="btnBatchSaveToWorks">
      <svg width="15" height="15"><use href="#icon-bookmark" /></svg><span>存入作品</span>
    </button>
    <button class="batch-bar-btn hidden" id="btnBatchSaveToCandidates">
      <svg width="15" height="15"><use href="#icon-bookmark" /></svg><span>入库候选</span>
    </button>
    <span class="batch-bar-sep"></span>
    <button class="batch-bar-btn batch-bar-danger" id="btnBatchDelete" disabled title="移除（Delete）" aria-keyshortcuts="Delete">
      <svg width="15" height="15"><use href="#icon-delete" /></svg><span>移除</span>
    </button>
    <span class="batch-bar-sep"></span>
    <button class="batch-bar-btn batch-bar-done" id="btnBatchDone">完成</button>
  </div>

  <!-- ====== 详情覆盖层（对齐抖音播放界面：全宽播放器 + 56px 播放条） ====== -->
  <div id="detailOverlay" class="flex-col hidden">
    <button id="detailClose" class="flex-center" type="button" aria-label="关闭详情（Esc）">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <path d="M5 5l14 14M19 5L5 19" />
      </svg>
    </button>
    <div class="detail-body">
      <!-- 清晰画面区（宽度随媒体宽高比自适应，按可视高等比铺满、超视口宽截断；列内留白由 overlay 模糊背景透出填充） -->
      <div class="media-view">
        <div id="detailVideoContainer" class="flex-col hidden">
          <div id="detailVideoWrap" class="flex-center">
            <video id="detailVideo" playsinline></video>
            <!-- 加载中指示 -->
            <div id="detailLoader" class="detail-loader hidden flex-center">
              <div class="spinner"></div>
            </div>
          </div>
        </div>
        <div id="detailImageContainer" class="hidden">
          <div class="detail-image-container flex-center">
            <div id="detailImage" role="img" style="transition: opacity 0.2s"></div>
            <audio id="detailAudio" style="display: none"></audio>
          </div>
        </div>
      </div>
      <!-- 导航箭头挂 .detail-body 直下：不参与作品切换动效（容器淡入淡出与媒体滑动） -->
      <div id="detailNavLeft" class="detail-nav-btn flex-center hidden" aria-label="上一张">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </div>
      <div id="detailNavRight" class="detail-nav-btn detail-nav-right flex-center hidden" aria-label="下一张">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
          <path d="M9 6l6 6-6 6" />
        </svg>
      </div>
    </div>
    <!-- 上/下作品切换胶囊（对齐抖音 ⌃⌄：右缘垂直居中，切上一个/下一个作品） -->
    <div id="detailSwitcher">
      <button id="detailSwitchPrev" class="flex-center" aria-label="上一个作品">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 15l-6-6-6 6" />
        </svg>
      </button>
      <button id="detailSwitchNext" class="flex-center" aria-label="下一个作品">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </button>
    </div>
    <div id="detailBottomBar">
      <!-- 进度条贴播放条顶缘（通栏）：视频=连续轨道+时间气泡，图集=分段进度（与音乐同步） -->
      <div id="detailProgress" role="slider" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="track-wrap">
          <div class="track">
            <div class="track-buffered"></div>
            <div class="track-played"></div>
            <div class="track-thumb"></div>
          </div>
          <span class="time-tip">0:00 / 0:00</span>
        </div>
        <div id="noteSegs" class="hidden"></div>
      </div>
      <div class="bar-group bar-controls flex-row">
        <button id="detailPlayBtn" class="detail-bar-btn icon-btn flex-center" aria-label="播放"></button>
        <span id="detailTime" class="detail-bar-text detail-bar-time hidden">0:00 / 0:00</span>
        <span id="detailOrder" class="detail-bar-text detail-bar-order hidden">1/1</span>
      </div>
      <span class="bar-divider"></span>
      <div class="bar-group bar-meta flex-row">
        <a id="detailAuthor" class="detail-bar-text detail-bar-author hidden" target="_blank" rel="noopener"></a>
        <a id="detailVisit" class="detail-bar-visit" target="_blank" rel="noopener"></a>
        <span id="detailCreateTime" class="detail-bar-text detail-bar-date hidden"></span>
      </div>
      <span class="bar-divider"></span>
      <div class="bar-group bar-actions flex-row">
        <button id="detailMuteBtn" class="detail-bar-btn icon-btn flex-center" aria-label="静音"></button>
        <button id="detailRemoveBtn" class="detail-bar-btn icon-btn flex-center" title="移除" aria-label="移除">
          <svg width="24" height="24">
            <use href="#icon-delete" />
          </svg>
        </button>
        <button id="detailLoopBtn" class="detail-bar-btn icon-btn flex-center" title="循环模式" aria-label="循环模式"></button>
        <button id="detailDownloadBtn" class="detail-bar-btn icon-btn flex-center" title="下载" aria-label="下载">
          <svg width="24" height="24">
            <use href="#icon-download" />
          </svg>
        </button>
        <span id="detailCounter" class="detail-bar-text detail-bar-counter hidden"><input id="detailCounterInput" class="detail-counter-input" type="text" inputmode="numeric" maxlength="6" aria-label="当前序号，输入后回车跳转" /><span id="detailCounterTotal"> / 0</span></span>
      </div>
    </div>
  </div>

  <!-- ====== 自定义弹窗容器（抖音风格） ====== -->
  <div id="dialogOverlay" class="dialog-overlay hidden">
    <div class="dy-dialog flex-col" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="dy-dialog-header flex-row">
        <span id="dialogTitle"></span>
        <button class="dy-dialog-close icon-btn flex-center" id="dialogClose" aria-label="关闭">✕</button>
      </div>
      <div class="dy-dialog-body" id="dialogBody"></div>
      <div class="dy-dialog-footer" id="dialogFooter"></div>
    </div>
  </div>

  <!-- 骨架与完整卡同构（原地填充/降级不换根节点），仅类名与占位样式不同；
       头像失败时由 following-avatar-fallback 显示昵称首字占位。
       头像必须是 div+background-image：背景图加载失败浏览器不绘制裂图图标，元素层面杜绝断裂图 -->
  <template id="followingSkeletonTemplate">
    <div class="following-card following-skeleton" data-uid="">
      <div class="following-main">
        <div class="following-avatar" role="img"></div>
        <span class="following-avatar-fallback hidden"></span>
        <div class="following-nickname"></div>
      </div>
      <!-- 信息区以细分隔线独立成次级区块（分辨批量点击区域，不抢身份行视觉重心） -->
      <div class="following-details">
        <div class="following-stats">
          <span class="stat-followers"></span>
          <span class="stat-works"></span>
        </div>
        <div class="following-update"></div>
      </div>
    </div>
  </template>

  <!-- ====== 侧边栏作品模板 ====== -->
  <!-- 信息条在封面链接之外（存入/♥/★ 点击不得触发外链跳转）；骨架态由 #createWorkItem 即时填充，
       不存在独立骨架变体 -->
  <template id="sidebarWorkTemplate">
    <div class="sidebar-work-item">
      <a target="_blank" rel="noopener" class="sidebar-work-link">
        <!-- 封面必须是 div+background-image：背景图失败浏览器不绘制裂图图标，内联 onerror 一并废除 -->
        <div class="sidebar-work-cover"></div>
        <!-- 悬停预览播放器：无 src + preload=none 常驻轻量，指针进入才赋 src 起播（图集 note 不创建） -->
        <video class="sidebar-work-player" muted playsinline preload="none"></video>
        <div class="sidebar-work-cover-placeholder">📹</div>
        <div class="work-type-badge flex-row hidden">
          <svg width="12" height="12">
            <use href="#icon-image-badge" />
          </svg>
        </div>
      </a>
      <div class="sidebar-work-info">
        <span class="sidebar-work-date"></span>
        <button class="sidebar-presence sidebar-presence-like" type="button"><svg width="18" height="18"><use href="#icon-heart" /></svg></button>
        <button class="sidebar-presence sidebar-presence-collect" type="button"><svg width="18" height="18"><use href="#icon-star" /></svg></button>
        <button class="sidebar-work-save" type="button" aria-label="存入作品域"><svg width="18" height="18"><use href="#icon-bookmark" /></svg></button>
      </div>
    </div>
  </template>

  <!-- ====== 作品卡片模板 ====== -->
  <template id="workCardTemplate">
    <div class="work-card flex-col">
      <div class="work-media">
        <div class="work-type-badge flex-row hidden">
          <svg width="12" height="12">
            <use href="#icon-image-badge" />
          </svg>
        </div>
        <!-- 缩略图必须是 div+background-image：背景图加载失败浏览器不绘制裂图图标，元素层面杜绝断裂图 -->
        <div class="work-thumb" role="img"></div>
        <video class="work-video-player" muted playsinline preload="none"></video>
        <div class="work-video-controls">
          <div class="video-controls-top">
            <button class="video-play-btn detail-bar-btn icon-btn flex-center" aria-label="播放预览"></button>
            <span class="video-time">0:00 / 0:00</span>
            <button class="video-mute-btn detail-bar-btn icon-btn flex-center" aria-label="静音预览"></button>
          </div>
          <input type="range" class="video-progress" min="0" max="100" value="0" aria-label="播放进度" />
        </div>
      </div>
      <div class="work-checkbox" role="checkbox" aria-checked="false" aria-label="选择作品"></div>
      <div class="work-info flex-col">
        <div class="work-author-row">
          <a class="work-author text-ellipsis" target="_blank" rel="noopener"></a>
          <span class="work-create-time hidden"></span>
        </div>
      </div>
    </div>
  </template>

  <template id="workSkeletonTemplate">
    <div class="work-card work-skeleton flex-col">
      <div class="work-media"></div>
      <div class="work-info flex-col">
        <div class="work-author-row">
          <a class="work-author text-ellipsis" target="_blank" rel="noopener"></a>
          <span class="work-create-time hidden"></span>
        </div>
      </div>
    </div>
  </template>

    <button class="group-tab"><span class="group-tab-name"></span><span class="group-tab-count"></span></button>

            </svg></span>

        <button class="dy-btn flex-inline-center dy-btn-sm dy-btn-ghost dy-btn-danger delete-btn" aria-label="删除分组">

              <use href="#icon-delete" />
            </svg></span>
        </button>

      <span class="btn-icon flex-inline-center"><svg width="14" height="14">

      <span class="sync-status"></span>

  <!-- ====== 设置面板模板 ====== -->
  <template id="settingsDialogTemplate">

              aria-label="回顾数据来源" aria-haspopup="listbox" aria-expanded="false" aria-controls="settingsReviewSourceMenu">
              <span class="sb-scope-value">作品</span>
              <span class="sb-scope-arrow" aria-hidden="true">▾</span>
              <div id="settingsReviewSourceMenu" class="sb-scope-menu hidden" role="listbox" aria-label="回顾数据来源选项">
                <button class="sb-scope-option active" role="option" data-source="works" aria-selected="true">作品</button>
                <button class="sb-scope-option" role="option" data-source="favorites" aria-selected="false">点赞</button>
                <button class="sb-scope-option" role="option" data-source="collections" aria-selected="false">收藏</button>
                <button class="sb-scope-option" role="option" data-source="followings" aria-selected="false">关注</button>
                <button class="sb-scope-option" role="option" data-source="candidates" aria-selected="false">候选</button>

            </div>

          </div>
        </div>
        <div class="kv-row"><label class="bf-label">请求超时 (ms)</label><input class="bf-input config-input" data-key="timeoutRequest" type="number" /></div>

        <div class="kv-row"><label class="bf-label">同步关注 延迟 min/max (ms)</label><input class="bf-input config-input" data-key="syncFollowingsDelayMin" type="number" style="width:80px" /><span style="margin:0 4px;color:var(--dy-text-muted)">~</span><input class="bf-input config-input" data-key="syncFollowingsDelayMax" type="number" style="width:80px" /></div>
        <div class="kv-row"><label class="bf-label">扫描点赞 延迟 min/max (ms)</label><input class="bf-input config-input" data-key="syncFavoritesDelayMin" type="number" style="width:80px" /><span style="margin:0 4px;color:var(--dy-text-muted)">~</span><input class="bf-input config-input" data-key="syncFavoritesDelayMax" type="number" style="width:80px" /></div>
        <div class="kv-row"><label class="bf-label">扫描收藏 延迟 min/max (ms)</label><input class="bf-input config-input" data-key="syncCollectionDelayMin" type="number" style="width:80px" /><span style="margin:0 4px;color:var(--dy-text-muted)">~</span><input class="bf-input config-input" data-key="syncCollectionDelayMax" type="number" style="width:80px" /></div>
        <div class="kv-row"><label class="bf-label">取消点赞 延迟 min/max (ms)</label><input class="bf-input config-input" data-key="cancelFavoritesDelayMin" type="number" style="width:80px" /><span style="margin:0 4px;color:var(--dy-text-muted)">~</span><input class="bf-input config-input" data-key="cancelFavoritesDelayMax" type="number" style="width:80px" /></div>
        <div class="kv-row"><label class="bf-label">取消收藏 延迟 min/max (ms)</label><input class="bf-input config-input" data-key="cancelCollectionDelayMin" type="number" style="width:80px" /><span style="margin:0 4px;color:var(--dy-text-muted)">~</span><input class="bf-input config-input" data-key="cancelCollectionDelayMax" type="number" style="width:80px" /></div>
        <div class="kv-row"><label class="bf-label">作者入库 延迟 min/max (ms)</label><input class="bf-input config-input" data-key="importWorksDelayMin" type="number" style="width:80px" /><span style="margin:0 4px;color:var(--dy-text-muted)">~</span><input class="bf-input config-input" data-key="importWorksDelayMax" type="number" style="width:80px" /></div>
        <div class="kv-row"><label class="bf-label">同步批次大小</label><input class="bf-input config-input" data-key="syncBatchSize" type="number" /></div>
        <div class="kv-row"><label class="bf-label">批次暂停最小值 (ms)</label><input class="bf-input config-input" data-key="syncBatchPauseMin" type="number" /></div>
        <div class="kv-row"><label class="bf-label">批次暂停最大值 (ms)</label><input class="bf-input config-input" data-key="syncBatchPauseMax" type="number" /></div>
        <div class="kv-row"><label class="bf-label">保活间隔 (ms)</label><input class="bf-input config-input" data-key="syncKeepaliveInterval" type="number" /></div>
        <div class="kv-row"><label class="bf-label">最大重试次数</label><input class="bf-input config-input" data-key="syncRetryMax" type="number" /></div>
        <div class="settings-mode-row"><label for="settingsModeSwitch">启用独立模式（无需抖音标签页）</label><input class="mode-toggle" type="checkbox" id="settingsModeSwitch" role="switch" /></div>

        </div>
        <div id="settingsCacheList"></div>
      </div>
    </div>
